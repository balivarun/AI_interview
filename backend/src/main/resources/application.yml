server:
  port: 8080

spring:
  application:
    name: interviewai-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/interviewai}
    username: ${DATABASE_USERNAME:interviewai}
    password: ${DATABASE_PASSWORD:interviewai}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  clerk-issuer: ${CLERK_ISSUER:}
  clerk-jwks-uri: ${CLERK_JWKS_URI:}
  clerk-publishable-key: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html